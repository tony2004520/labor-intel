<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勞動新聞 — Labortopics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg: #f8fafc;
    --card-bg: #fff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --tag-bg: #eff6ff;
    --tag-color: #2563eb;
  }

  body { font-family: -apple-system, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); }

  /* Navbar */
  nav {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-logo { font-weight: 800; font-size: 1.1rem; color: var(--primary); text-decoration: none; }
  .nav-links { display: flex; gap: 1.5rem; align-items: center; }
  .nav-links a { text-decoration: none; color: var(--text-muted); font-size: 0.9rem; transition: color .2s; }
  .nav-links a:hover { color: var(--primary); }
  .nav-right { display: flex; align-items: center; gap: 1rem; }

  /* Auth */
  .auth-btn {
    padding: 0.4rem 1rem;
    border-radius: 6px;
    font-size: 0.88rem;
    cursor: pointer;
    border: none;
    font-weight: 600;
    transition: all .2s;
  }
  .btn-login { background: var(--primary); color: #fff; }
  .btn-login:hover { background: var(--primary-dark); }
  .btn-logout { background: #f1f5f9; color: var(--text-muted); }
  .btn-logout:hover { background: #e2e8f0; }
  .user-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--border);
  }
  .user-info { display: flex; align-items: center; gap: 0.5rem; font-size: 0.88rem; }

  /* Hero */
  .hero {
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    color: #fff;
    padding: 3rem 1.5rem;
    text-align: center;
  }
  .hero h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
  .hero p { opacity: 0.85; font-size: 1rem; margin-bottom: 1.5rem; }

  /* 搜尋 */
  .search-wrap {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    gap: 0.5rem;
  }
  .search-wrap input {
    flex: 1;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    outline: none;
  }
  .search-wrap button {
    padding: 0.75rem 1.25rem;
    background: #f59e0b;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
    transition: background .2s;
  }
  .search-wrap button:hover { background: #d97706; }

  /* 標籤篩選 */
  .filter-bar {
    max-width: 1200px;
    margin: 1.5rem auto 0;
    padding: 0 1.5rem;
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
  .tag-btn {
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: #fff;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all .15s;
    color: var(--text-muted);
  }
  .tag-btn:hover, .tag-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  /* 排序 */
  .sort-bar {
    max-width: 1200px;
    margin: 1rem auto 0;
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sort-bar span { font-size: 0.85rem; color: var(--text-muted); }
  .sort-select {
    padding: 0.3rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.85rem;
    background: #fff;
    cursor: pointer;
  }

  /* 新聞卡片 */
  .news-grid {
    max-width: 1200px;
    margin: 1.5rem auto 3rem;
    padding: 0 1.5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.25rem;
  }

  .card {
    background: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: box-shadow .2s, transform .2s;
    cursor: pointer;
  }
  .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,.1); transform: translateY(-2px); }

  .card-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    background: linear-gradient(135deg, #dbeafe, #bfdbfe);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    color: #93c5fd;
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }

  .card-body { padding: 1rem; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.5rem; }
  .tag {
    background: var(--tag-bg);
    color: var(--tag-color);
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .card-title { font-size: 1rem; font-weight: 700; line-height: 1.4; margin-bottom: 0.5rem; }
  .card-meta { display: flex; align-items: center; justify-content: space-between; }
  .card-date { font-size: 0.78rem; color: var(--text-muted); }
  .card-author { font-size: 0.78rem; color: var(--text-muted); }

  .bookmark-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.2rem;
    padding: 0.2rem;
    transition: transform .15s;
    line-height: 1;
  }
  .bookmark-btn:hover { transform: scale(1.2); }

  /* 搜尋結果標示 */
  .search-result-bar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1.5rem;
    font-size: 0.88rem;
    color: var(--text-muted);
  }
  .search-result-bar strong { color: var(--primary); }

  /* Loading / Empty */
  .loading, .empty {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text-muted);
    grid-column: 1/-1;
  }
  .loading::after {
    content: '';
    display: inline-block;
    width: 24px; height: 24px;
    border: 3px solid #ddd;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-left: 0.5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 文章詳情 Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 16px;
    max-width: 700px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 1;
  }
  .modal-title { font-size: 1.2rem; font-weight: 800; line-height: 1.4; }
  .modal-close {
    background: #f1f5f9;
    border: none;
    border-radius: 50%;
    width: 32px; height: 32px;
    cursor: pointer;
    font-size: 1rem;
    flex-shrink: 0;
    transition: background .2s;
  }
  .modal-close:hover { background: #e2e8f0; }
  .modal-img { width: 100%; max-height: 300px; object-fit: cover; }
  .modal-body { padding: 1.5rem; line-height: 1.8; }
  .modal-meta { display: flex; gap: 1rem; margin-bottom: 1rem; font-size: 0.85rem; color: var(--text-muted); flex-wrap: wrap; }
  .modal-content { font-size: 0.97rem; }
  .modal-content p { margin-bottom: 1rem; }
  .modal-bookmark-btn {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    font-size: 0.88rem;
    transition: all .2s;
    margin-top: 1.5rem;
  }
  .modal-bookmark-btn:hover { border-color: #f59e0b; color: #f59e0b; }
  .modal-bookmark-btn.bookmarked { background: #fef3c7; border-color: #f59e0b; color: #b45309; }

  /* 收藏頁 */
  .bookmarks-tab { display: none; }
  .bookmarks-tab.active { display: block; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1e293b;
    color: #fff;
    padding: 0.7rem 1.5rem;
    border-radius: 8px;
    font-size: 0.9rem;
    z-index: 300;
    transition: transform .3s;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Tab */
  .tab-bar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1.5rem;
    display: flex;
    gap: 0;
    border-bottom: 2px solid var(--border);
    margin-top: 1.5rem;
  }
  .tab {
    padding: 0.6rem 1.2rem;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: all .2s;
    font-weight: 600;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  @media (max-width: 600px) {
    .hero h1 { font-size: 1.5rem; }
    .news-grid { grid-template-columns: 1fr; }
    .nav-links { display: none; }
  }
</style>
</head>
<body>

<!-- Navbar -->
<nav>
  <a class="nav-logo" href="index.html">⚖️ Labortopics</a>
  <div class="nav-links">
    <a href="index.html">首頁</a>
    <a href="news.html" style="color:var(--primary);font-weight:600;">勞動新聞</a>
    <a href="index.html#qa">法規問答</a>
  </div>
  <div class="nav-right" id="authArea">
    <button class="auth-btn btn-login" onclick="loginWithGoogle()">Google 登入</button>
  </div>
</nav>

<!-- Hero -->
<div class="hero">
  <h1>📰 勞動新聞中心</h1>
  <p>即時掌握台灣與國際勞動議題，不限時間搜尋所有歷史新聞</p>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="搜尋議題，例如：資遣、職災、最低工資…" 
      onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜尋</button>
  </div>
</div>

<!-- Tab -->
<div class="tab-bar">
  <div class="tab active" onclick="switchTab('news', this)">🗞️ 所有新聞</div>
  <div class="tab" onclick="switchTab('bookmarks', this)">❤️ 我的收藏</div>
</div>

<!-- 新聞區 -->
<div id="newsTab">
  <!-- 標籤篩選 -->
  <div class="filter-bar" id="filterBar">
    <span class="filter-label">標籤篩選：</span>
    <button class="tag-btn active" onclick="filterTag('', this)">全部</button>
  </div>

  <!-- 排序 -->
  <div class="sort-bar">
    <span id="resultCount"></span>
    <select class="sort-select" onchange="sortArticles(this.value)">
      <option value="date_desc">最新優先</option>
      <option value="date_asc">最舊優先</option>
      <option value="title">標題 A-Z</option>
    </select>
  </div>

  <!-- 搜尋結果提示 -->
  <div class="search-result-bar" id="searchResultBar" style="display:none;margin-top:.5rem;"></div>

  <!-- 文章列表 -->
  <div class="news-grid" id="newsGrid">
    <div class="loading">載入新聞中</div>
  </div>
</div>

<!-- 收藏區 -->
<div id="bookmarksTab" style="display:none;">
  <div class="news-grid" id="bookmarksGrid">
    <div class="empty">登入後即可查看收藏 ❤️</div>
  </div>
</div>

<!-- 文章詳情 Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <img class="modal-img" id="modalImg" style="display:none">
    <div class="modal-body">
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-content" id="modalContent"></div>
      <button class="modal-bookmark-btn" id="modalBookmarkBtn" onclick="toggleBookmarkModal()">
        <span id="modalBookmarkIcon">🤍</span>
        <span id="modalBookmarkText">加入收藏</span>
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── 設定 ────────────────────────────────────────────
const SUPABASE_URL  = 'https://ghovsfwxziysqfftvknn.supabase.co'
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdob3ZzZnd4eml5c3FmZnR2a25uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NDk5MzEsImV4cCI6MjEwNTIyNTkzMX0.TOzya_TaMp02v9099snu6MWzIZLGvVsN8DTeGcPTlVE'
const SHEET_ID      = '1qzCpWNwrXntkDa-cBYlkUGB_l3c4B9alk-jTNhS7Sb4'
const SHEET_NAME    = '工作表1'

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON)

let allArticles = []
let filteredArticles = []
let currentTag = ''
let currentSearch = ''
let currentSort = 'date_desc'
let currentUser = null
let userBookmarks = new Set()
let currentArticle = null

// ── 初始化 ───────────────────────────────────────────
async function init() {
  await checkAuth()
  await loadArticles()
}

// ── Google 登入 ──────────────────────────────────────
async function loginWithGoogle() {
  await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.href }
  })
}

async function logout() {
  await sb.auth.signOut()
  currentUser = null
  userBookmarks.clear()
  renderAuthArea()
  renderBookmarks()
  renderArticles()
}

async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession()
  if (session?.user) {
    currentUser = session.user
    renderAuthArea()
    await loadBookmarks()
  }
  sb.auth.onAuthStateChange(async (event, session) => {
    currentUser = session?.user || null
    renderAuthArea()
    if (currentUser) {
      await loadBookmarks()
    } else {
      userBookmarks.clear()
    }
    renderArticles()
    renderBookmarks()
  })
}

function renderAuthArea() {
  const area = document.getElementById('authArea')
  if (currentUser) {
    const name = currentUser.user_metadata?.name || currentUser.email
    const avatar = currentUser.user_metadata?.avatar_url
    area.innerHTML = `
      <div class="user-info">
        ${avatar ? `<img class="user-avatar" src="${avatar}" alt="${name}">` : ''}
        <span>${name.split(' ')[0]}</span>
      </div>
      <button class="auth-btn btn-logout" onclick="logout()">登出</button>
    `
  } else {
    area.innerHTML = `<button class="auth-btn btn-login" onclick="loginWithGoogle()">🔑 Google 登入</button>`
  }
}

// ── 從 Google Sheet 載入文章 ──────────────────────────
async function loadArticles() {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`
    const res = await fetch(url)
    const text = await res.text()
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1])
    
    const rows = json.table.rows
    const cols = json.table.cols.map(c => c.label)
    
    allArticles = rows.map(row => {
      const obj = {}
      cols.forEach((col, i) => {
        obj[col] = row.c[i]?.v || ''
      })
      return obj
    }).filter(a => a.title)

    buildTagFilter()
    applyFilters()
  } catch(e) {
    console.error(e)
    document.getElementById('newsGrid').innerHTML = '<div class="empty">載入失敗，請稍後再試</div>'
  }
}

// ── 標籤篩選器 ────────────────────────────────────────
function buildTagFilter() {
  const allTags = new Set()
  allArticles.forEach(a => {
    if (a.tags) {
      a.tags.split(',').forEach(t => allTags.add(t.trim().replace(/^#/, '')))
    }
  })
  
  const bar = document.getElementById('filterBar')
  const existing = bar.innerHTML
  allTags.forEach(tag => {
    const btn = document.createElement('button')
    btn.className = 'tag-btn'
    btn.textContent = '#' + tag
    btn.onclick = () => filterTag(tag, btn)
    bar.appendChild(btn)
  })
}

function filterTag(tag, el) {
  currentTag = tag
  document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'))
  el.classList.add('active')
  applyFilters()
}

// ── 搜尋 ──────────────────────────────────────────────
function doSearch() {
  currentSearch = document.getElementById('searchInput').value.trim()
  applyFilters()
}

// ── 排序 ──────────────────────────────────────────────
function sortArticles(val) {
  currentSort = val
  applyFilters()
}

// ── 套用篩選+搜尋+排序 ──────────────────────────────────
function applyFilters() {
  let results = [...allArticles]
  
  // 標籤篩選
  if (currentTag) {
    results = results.filter(a => a.tags && a.tags.includes(currentTag))
  }
  
  // 搜尋
  if (currentSearch) {
    const q = currentSearch.toLowerCase()
    results = results.filter(a =>
      (a.title && a.title.toLowerCase().includes(q)) ||
      (a.content && a.content.toLowerCase().includes(q)) ||
      (a.tags && a.tags.toLowerCase().includes(q)) ||
      (a.author && a.author.toLowerCase().includes(q))
    )
  }
  
  // 排序
  results.sort((a, b) => {
    if (currentSort === 'date_desc') return new Date(b.date) - new Date(a.date)
    if (currentSort === 'date_asc')  return new Date(a.date) - new Date(b.date)
    if (currentSort === 'title')     return a.title.localeCompare(b.title)
    return 0
  })
  
  filteredArticles = results
  
  // 更新搜尋結果提示
  const bar = document.getElementById('searchResultBar')
  if (currentSearch) {
    bar.style.display = 'block'
    bar.innerHTML = `搜尋「<strong>${currentSearch}</strong>」找到 <strong>${results.length}</strong> 篇文章`
  } else {
    bar.style.display = 'none'
  }
  
  document.getElementById('resultCount').textContent = `共 ${results.length} 篇文章`
  
  renderArticles()
}

// ── 渲染文章列表 ──────────────────────────────────────
function renderArticles() {
  const grid = document.getElementById('newsGrid')
  
  if (filteredArticles.length === 0) {
    grid.innerHTML = '<div class="empty">沒有找到相關文章 🔍</div>'
    return
  }
  
  grid.innerHTML = filteredArticles.map(a => cardHTML(a)).join('')
}

function cardHTML(a) {
  const tags = a.tags ? a.tags.split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('') : ''
  const isBookmarked = userBookmarks.has(String(a.id))
  const imgUrl = getImageUrl(a.cover_image)
  
  return `
    <div class="card" onclick="openArticle(${a.id})">
      <div class="card-img">
        ${imgUrl 
          ? `<img src="${imgUrl}" alt="${a.title}" onerror="this.parentElement.innerHTML='📰'">` 
          : '📰'}
      </div>
      <div class="card-body">
        <div class="card-tags">${tags}</div>
        <div class="card-title">${a.title}</div>
        <div class="card-meta">
          <span class="card-date">🗓 ${a.date}</span>
          <button class="bookmark-btn" onclick="event.stopPropagation();toggleBookmark('${a.id}', '${a.title}', '${a.date}', this)">
            ${isBookmarked ? '❤️' : '🤍'}
          </button>
        </div>
      </div>
    </div>
  `
}

// ── Google Drive 圖片 URL 轉換 ────────────────────────
function getImageUrl(url) {
  if (!url) return null
  const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/)
  if (match) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w600`
  return url
}

// ── 開啟文章 Modal ────────────────────────────────────
function openArticle(id) {
  const a = allArticles.find(x => String(x.id) === String(id))
  if (!a) return
  currentArticle = a
  
  document.getElementById('modalTitle').textContent = a.title
  
  const imgUrl = getImageUrl(a.content_image || a.cover_image)
  const modalImg = document.getElementById('modalImg')
  if (imgUrl) {
    modalImg.src = imgUrl
    modalImg.style.display = 'block'
    modalImg.onerror = () => { modalImg.style.display = 'none' }
  } else {
    modalImg.style.display = 'none'
  }
  
  const tags = a.tags ? a.tags.split(',').map(t => `<span class="tag">${t.trim()}</span>`).join(' ') : ''
  document.getElementById('modalMeta').innerHTML = `
    <span>🗓 ${a.date}</span>
    <span>✍️ ${a.author || '編輯部'}</span>
    <span>${tags}</span>
  `
  
  document.getElementById('modalContent').innerHTML = a.content || '<p>（內文準備中）</p>'
  
  updateModalBookmarkBtn()
  document.getElementById('modalOverlay').classList.add('show')
  document.body.style.overflow = 'hidden'
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show')
  document.body.style.overflow = ''
}

function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal()
}

function updateModalBookmarkBtn() {
  if (!currentArticle) return
  const isBookmarked = userBookmarks.has(String(currentArticle.id))
  document.getElementById('modalBookmarkIcon').textContent = isBookmarked ? '❤️' : '🤍'
  document.getElementById('modalBookmarkText').textContent = isBookmarked ? '已收藏' : '加入收藏'
  document.getElementById('modalBookmarkBtn').classList.toggle('bookmarked', isBookmarked)
}

// ── 收藏功能 ──────────────────────────────────────────
async function toggleBookmark(id, title, date, btn) {
  if (!currentUser) {
    showToast('請先登入才能收藏 🔑')
    return
  }
  
  const strId = String(id)
  if (userBookmarks.has(strId)) {
    await sb.from('bookmarks').delete()
      .eq('user_id', currentUser.id)
      .eq('article_id', strId)
    userBookmarks.delete(strId)
    if (btn) btn.textContent = '🤍'
    showToast('已取消收藏')
  } else {
    await sb.from('bookmarks').upsert({
      user_id: currentUser.id,
      article_id: strId,
      article_title: title,
      article_date: date,
    })
    userBookmarks.add(strId)
    if (btn) btn.textContent = '❤️'
    showToast('已加入收藏 ❤️')
  }
  
  updateModalBookmarkBtn()
  renderBookmarks()
}

async function toggleBookmarkModal() {
  if (!currentArticle) return
  await toggleBookmark(currentArticle.id, currentArticle.title, currentArticle.date, null)
}

async function loadBookmarks() {
  if (!currentUser) return
  const { data } = await sb.from('bookmarks')
    .select('article_id')
    .eq('user_id', currentUser.id)
  userBookmarks = new Set((data || []).map(b => b.article_id))
}

async function renderBookmarks() {
  const grid = document.getElementById('bookmarksGrid')
  
  if (!currentUser) {
    grid.innerHTML = '<div class="empty">登入後即可查看收藏 ❤️</div>'
    return
  }
  
  if (userBookmarks.size === 0) {
    grid.innerHTML = '<div class="empty">還沒有收藏任何文章，看到喜歡的點 🤍 加入收藏</div>'
    return
  }
  
  const bookmarkedArticles = allArticles.filter(a => userBookmarks.has(String(a.id)))
  grid.innerHTML = bookmarkedArticles.length > 0
    ? bookmarkedArticles.map(a => cardHTML(a)).join('')
    : '<div class="empty">收藏的文章不在目前資料中</div>'
}

// ── Tab 切換 ──────────────────────────────────────────
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
  el.classList.add('active')
  
  document.getElementById('newsTab').style.display = tab === 'news' ? 'block' : 'none'
  document.getElementById('bookmarksTab').style.display = tab === 'bookmarks' ? 'block' : 'none'
  
  if (tab === 'bookmarks') renderBookmarks()
}

// ── Toast ─────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 2500)
}

// ── 啟動 ──────────────────────────────────────────────
init()
</script>
</body>
</html>
