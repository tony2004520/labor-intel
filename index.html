<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勞動新聞情報站 · Labor Intel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1923;--panel:#162232;--card:#1a2d42;--card-h:#1f3450;
  --border:#243a52;--bd2:#1c2f44;
  --text:#dce9f5;--mid:#8aaec8;--dim:#4a6a85;
  --accent:#f0a500;--adim:#7a5200;--live:#2ecc71;--r:4px;
}
html{font-size:15px}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* TOPBAR */
.topbar{background:var(--panel);border-bottom:1px solid var(--border);height:54px;display:flex;align-items:center;padding:0 1.2rem;gap:.8rem;position:sticky;top:0;z-index:100}
.logo{font-family:'Noto Serif TC',serif;font-weight:700;font-size:.95rem;white-space:nowrap;flex-shrink:0}
.logo em{color:var(--accent);font-style:normal}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tinfo{font-size:.67rem;color:var(--dim);white-space:nowrap}
.tinfo b{color:var(--mid)}
.sp{flex:1}
.tbtn{background:none;border:1px solid var(--border);color:var(--mid);font-size:.68rem;padding:.28rem .65rem;border-radius:var(--r);cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.rbtn-spin{animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* LAYOUT */
.layout{display:flex;flex:1}

/* SIDEBAR */
.sidebar{width:185px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:.6rem 0 2rem;overflow-y:auto}
.sb-label{font-size:.6rem;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;padding:.85rem 1rem .25rem}
.sb-btn{display:flex;align-items:center;gap:.45rem;width:100%;padding:.42rem 1rem;background:none;border:none;border-left:2px solid transparent;color:var(--mid);font-size:.74rem;text-align:left;cursor:pointer;font-family:inherit;transition:.12s}
.sb-btn:hover{background:var(--card);color:var(--text)}
.sb-btn.on{background:var(--card);color:var(--text);border-left-color:var(--accent)}
.sb-cnt{margin-left:auto;font-size:.62rem;color:var(--dim);background:var(--bg);padding:.07rem .36rem;border-radius:2px;min-width:18px;text-align:center}
.sb-div{height:1px;background:var(--bd2);margin:.5rem 1rem}
.sw{margin:.5rem .75rem .1rem;position:relative}
.sw input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:.73rem;padding:.37rem .55rem .37rem 1.65rem;border-radius:var(--r);outline:none}
.sw input:focus{border-color:var(--accent)}
.sw input::placeholder{color:var(--dim)}
.sw-icon{position:absolute;left:.48rem;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}

/* MAIN */
.main{flex:1;padding:1rem 1.2rem 3rem;min-width:0;overflow-y:auto}
.statbar{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:.85rem}
.stat{font-size:.7rem;color:var(--dim)}
.stat b{color:var(--mid)}

/* BANNER */
.banner{background:rgba(240,165,0,.08);border:1px solid var(--adim);border-radius:var(--r);padding:.6rem .9rem;font-size:.74rem;color:var(--accent);display:flex;align-items:center;gap:.7rem;margin-bottom:.85rem;flex-wrap:wrap}
.banner button{background:var(--accent);border:none;color:#000;font-size:.68rem;font-weight:600;padding:.26rem .65rem;border-radius:var(--r);cursor:pointer;font-family:inherit}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:.9rem}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column}
.card:hover{background:var(--card-h);border-color:#2e4e70}
.ctop{padding:.78rem .88rem .58rem;display:flex;flex-direction:column;gap:.45rem}
.cmeta{display:flex;align-items:center;gap:.38rem;flex-wrap:wrap}
.spill{font-size:.6rem;font-weight:600;padding:.12rem .42rem;border-radius:2px;color:#fff;letter-spacing:.03em}
.s-ILO{background:#1a5fa0}.s-OECD{background:#1a6f42}.s-AJ{background:#a83228}.s-TG{background:#a85a1a}.s-HRW{background:#5a2fa0}.s-OT{background:#3a4a5a}
.rpill{font-size:.6rem;border:1px solid var(--border);color:var(--dim);padding:.12rem .42rem;border-radius:2px}
.cdate{margin-left:auto;font-size:.62rem;color:var(--dim);white-space:nowrap}
.ctitle{font-family:'Noto Serif TC',serif;font-size:.95rem;font-weight:600;line-height:1.65}
.ctitle a{color:var(--text);text-decoration:none}
.ctitle a:hover{color:#a8d4f5}

/* AI ZONE */
.aizone{border-top:1px solid var(--bd2);background:rgba(240,165,0,.03)}
.aitog{display:flex;align-items:center;gap:.42rem;padding:.48rem .88rem;cursor:pointer;font-size:.69rem;color:var(--accent);border:none;background:none;font-family:inherit;width:100%;text-align:left;user-select:none}
.aitog:hover{background:rgba(240,165,0,.07)}
.aitog .chev{margin-left:auto;transition:transform .2s}
.aitog.open .chev{transform:rotate(180deg)}
.ai-spin{width:11px;height:11px;border:2px solid var(--adim);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
.aibody{padding:0 .88rem .78rem;display:none;flex-direction:column;gap:.55rem}
.aibody.vis{display:flex}
.ail{font-size:.6rem;color:var(--accent);letter-spacing:.05em;margin-bottom:.15rem}
.ait{font-size:.77rem;line-height:1.73;color:var(--mid)}
.aitags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.08rem}
.aitag{font-size:.61rem;border:1px solid var(--adim);color:var(--accent);padding:.08rem .4rem;border-radius:2px}

/* FOOTER */
.cfoot{padding:.42rem .88rem;border-top:1px solid var(--bd2);display:flex;align-items:center}
.csc{font-size:.61rem;color:var(--dim)}
.clink{font-size:.66rem;color:var(--dim);text-decoration:none;margin-left:auto}
.clink:hover{color:var(--accent)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
.overlay.hidden{display:none}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:1.6rem;max-width:430px;width:100%;display:flex;flex-direction:column;gap:.85rem}
.modal h2{font-family:'Noto Serif TC',serif;font-size:1rem}
.modal p{font-size:.77rem;color:var(--mid);line-height:1.68}
.modal p a{color:var(--accent);text-decoration:none}
.modal input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:.78rem;padding:.46rem .65rem;border-radius:var(--r);outline:none}
.modal input:focus{border-color:var(--accent)}
.mbtns{display:flex;gap:.55rem;justify-content:flex-end;flex-wrap:wrap}
.mbtn{border:1px solid var(--border);background:none;color:var(--mid);font-size:.73rem;padding:.38rem .85rem;border-radius:var(--r);cursor:pointer;font-family:inherit;transition:.15s}
.mbtn:hover{border-color:var(--accent);color:var(--accent)}
.mbtn.ok{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.mbtn.ok:hover{background:#d49400}
.mnote{font-size:.66rem;color:var(--dim);line-height:1.55}
.empty{grid-column:1/-1;text-align:center;padding:3rem;color:var(--dim);font-size:.82rem}

@media(max-width:600px){.sidebar{display:none}.grid{grid-template-columns:1fr}.tinfo{display:none}}
</style>
</head>
<body>

<!-- KEY MODAL -->
<div class="overlay hidden" id="key-modal">
  <div class="modal">
    <h2>設定 Anthropic API Key</h2>
    <p>輸入您的 <a href="https://console.anthropic.com/settings/keys" target="_blank">Anthropic API Key</a> 以啟用 AI 即時搜尋與分析功能。<br>Key 僅存於您的瀏覽器，不會傳送至任何第三方。</p>
    <input type="password" id="key-input" placeholder="sk-ant-api03-..." autocomplete="off">
    <div class="mbtns">
      <button class="mbtn" id="key-skip">略過（只看現有新聞）</button>
      <button class="mbtn ok" id="key-save">確認啟用</button>
    </div>
    <div class="mnote">儲存後重整頁面仍有效。可隨時點右上角「⚙ Key」重設。</div>
  </div>
</div>

<!-- SEARCH MODAL -->
<div class="overlay hidden" id="search-modal">
  <div class="modal">
    <h2>即時議題搜尋</h2>
    <p>輸入任何勞動相關議題，AI 將即時搜尋最新國際新聞。</p>
    <input type="text" id="search-input" placeholder="例：台灣外勞政策、AI取代工作、罷工…" autocomplete="off">
    <div class="mbtns">
      <button class="mbtn" id="search-cancel">取消</button>
      <button class="mbtn ok" id="search-go">搜尋</button>
    </div>
  </div>
</div>

<!-- TOPBAR -->
<header class="topbar">
  <div class="logo">勞動新聞情報站 <em>·</em> Labor Intel</div>
  <div class="live-dot"></div>
  <div class="tinfo">更新：<b id="t-time">—</b></div>
  <div class="tinfo">下次：<b id="t-cd">—</b></div>
  <div class="sp"></div>
  <button class="tbtn" id="btn-key">⚙ Key</button>
  <button class="tbtn" id="btn-search">🔍 搜尋議題</button>
  <button class="tbtn" id="btn-refresh"><span id="refresh-icon">↻</span> 更新</button>
</header>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sw">
      <span class="sw-icon">⌕</span>
      <input type="text" id="filter-input" placeholder="篩選標題…">
    </div>
    <div class="sb-label">來源</div>
    <button class="sb-btn on" data-g="src" data-v="all">全部 <span class="sb-cnt" id="cnt-all">0</span></button>
    <button class="sb-btn" data-g="src" data-v="ILO">ILO <span class="sb-cnt" id="cnt-ILO">0</span></button>
    <button class="sb-btn" data-g="src" data-v="OECD">OECD <span class="sb-cnt" id="cnt-OECD">0</span></button>
    <button class="sb-btn" data-g="src" data-v="Al Jazeera">Al Jazeera <span class="sb-cnt" id="cnt-AJ">0</span></button>
    <button class="sb-btn" data-g="src" data-v="The Guardian">Guardian <span class="sb-cnt" id="cnt-TG">0</span></button>
    <button class="sb-btn" data-g="src" data-v="HRW">Human Rights Watch <span class="sb-cnt" id="cnt-HRW">0</span></button>
    <div class="sb-div"></div>
    <div class="sb-label">地區</div>
    <button class="sb-btn on" data-g="reg" data-v="all">全部地區</button>
    <button class="sb-btn" data-g="reg" data-v="Global">全球議題</button>
    <button class="sb-btn" data-g="reg" data-v="USA">美洲</button>
    <button class="sb-btn" data-g="reg" data-v="UK">英國</button>
    <button class="sb-btn" data-g="reg" data-v="EU">歐盟</button>
    <button class="sb-btn" data-g="reg" data-v="Asia">亞洲</button>
    <button class="sb-btn" data-g="reg" data-v="India">印度</button>
    <button class="sb-btn" data-g="reg" data-v="ILO / UN">ILO／聯合國</button>
    <div class="sb-div"></div>
    <div class="sb-label">功能</div>
    <button class="sb-btn" id="sb-search">🔍 即時議題搜尋</button>
    <button class="sb-btn" id="sb-key">⚙ API Key 設定</button>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="banner hidden" id="no-key-banner">
      ⚠ 尚未設定 API Key，AI 搜尋與分析功能未啟用。
      <button id="banner-btn">立即設定</button>
    </div>
    <div class="statbar" id="statbar">
      <div class="stat">收錄 <b id="s-total">0</b> 篇</div>
      <div class="stat">顯示 <b id="s-shown">0</b> 篇</div>
      <div class="stat">AI完成 <b id="s-ai">0</b> 篇</div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script>
// ── SEED DATA ────────────────────────────────────────────
const SEED = [
  {id:'s1',title:'ILO 通過首部平台經濟體面工作公約（第193號公約）',url:'https://www.ilo.org/resource/news/ilc/ilc114/international-labour-conference-ends-adoption-first-convention-decent-work',published:'2026-06-12',source:'ILO',location:'ILO / UN'},
  {id:'s2',title:'OECD 就業展望 2026：勞動市場強勁，但實際工資增長滯後',url:'https://www.oecd.org/en/about/news/press-releases/2026/07/oecd-job-markets-remain-strong-but-real-wages-are-lagging.html',published:'2026-07-07',source:'OECD',location:'Global'},
  {id:'s3',title:'聯合國通過條約為零工經濟工作者設定國際勞動標準',url:'https://www.aljazeera.com/news/2026/6/12/un-adopts-treaty-setting-standards-for-gig-economy-workers',published:'2026-06-12',source:'Al Jazeera',location:'ILO / UN'},
  {id:'s4',title:'美國前勞工部長 Chavez-DeRemer 遭聯邦監察機構指控失職',url:'https://www.aljazeera.com/news/2026/9/4/watchdog-report-alleges-misconduct-by-trumps-former-labour-secretary',published:'2026-09-04',source:'Al Jazeera',location:'USA'},
  {id:'s5',title:'ICJ 裁定罷工權受 ILO 第87號公約保護',url:'https://www.hrw.org/news/2026/06/12/ilo-adopts-landmark-treaty-on-gig-work',published:'2026-05-21',source:'HRW',location:'ILO / UN'},
  {id:'s6',title:'OECD：30國最低工資實質增長，低薪工人抗通膨更具韌性',url:'https://www.oecd.org/en/publications/oecd-employment-outlook-2026_7e710f54-en/full-report/component-5.html',published:'2026-07-07',source:'OECD',location:'Global'},
  {id:'s7',title:'五一國際勞動節全球集會：抗議戰爭衝擊就業與生活水準',url:'https://www.aljazeera.com/economy/2026/5/1/rallies-under-way-as-workers-gather-for-international-labour-day',published:'2026-05-01',source:'Al Jazeera',location:'Global'},
  {id:'s8',title:'歐盟在 ILO 理事會聲明：支持全球供應鏈體面勞動標準',url:'https://www.eeas.europa.eu/delegations/un-geneva/ilo-governing-body-356th-session-eu-statement-possible-initiatives-complement-body-international_en',published:'2026-03-25',source:'ILO',location:'EU'},
  {id:'s9',title:'德國2026年最低工資上調8.4%至13.9歐元，惠及660萬工人',url:'https://knowledge.dlapiper.com/dlapiperknowledge/globalemploymentlatestdevelopments/2026/ilo-adopts-a-convention-setting-standards-for-the-gig-economy',published:'2026-01-01',source:'OECD',location:'EU'},
  {id:'s10',title:'英國最低工資2026年升至12.71英鎊，創歷史新高',url:'https://tradingeconomics.com/united-kingdom/minimum-wages',published:'2026-04-01',source:'The Guardian',location:'UK'},
  {id:'s11',title:'ILO《2026年就業與社會趨勢》：近3億工人陷極端貧困',url:'https://researchrepository.ilo.org/esploro/outputs/report/Employment-and-social-trends-2026/995684768902676',published:'2026-01-01',source:'ILO',location:'Global'},
  {id:'s12',title:'印度要求零工平台在 eShram 登記工人，強化社會保障',url:'https://knowledge.dlapiper.com/dlapiperknowledge/globalemploymentlatestdevelopments/2026/ilo-adopts-a-convention-setting-standards-for-the-gig-economy',published:'2026-06-22',source:'ILO',location:'India'},
  {id:'s13',title:'勞動節2026：移民工人與工會面臨前所未有的職場權益挑戰',url:'https://www.parriva.com/labor-day-2026-workers-rights/',published:'2026-09-02',source:'Al Jazeera',location:'USA'},
  {id:'s14',title:'ILO 青年就業全球趨勢 2026：青年失業率上升，求職難度加劇',url:'https://www.ilo.org/',published:'2026-01-01',source:'ILO',location:'Global'},
  {id:'s15',title:'歐盟最低工資報告：各國月薪從620至2704歐元不等',url:'https://ec.europa.eu/eurostat/statistics-explained/index.php/Minimum_wage_statistics',published:'2026-01-01',source:'OECD',location:'EU'},
];

// ── STATE ────────────────────────────────────────────────
var arts = [];
var fSrc = 'all', fReg = 'all', fQ = '';
var apiKey = '';
var refreshTimer = null, cdTimer = null, nextAt = 0;
var TODAY = new Date().toISOString().slice(0,10);

// ── HELPERS ──────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtD(iso){
  if(!iso) return '—';
  try{ return new Date(iso+'T00:00:00').toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}); }
  catch(e){ return iso; }
}
function srcClass(s){ return {ILO:'ILO',OECD:'OECD','Al Jazeera':'AJ','The Guardian':'TG',HRW:'HRW'}[s]||'OT'; }
function regOk(loc){
  if(fReg==='all') return true;
  if(fReg==='Asia') return ['Taiwan','Japan','South Korea','China','India','Asia'].includes(loc);
  return loc===fReg;
}
function getFiltered(){
  var q = fQ.trim().toLowerCase();
  return arts.filter(function(a){
    var srcOk = fSrc==='all' || a.source===fSrc;
    var regOk2 = regOk(a.location);
    var qOk = !q || a.title.toLowerCase().includes(q) || (a.location||'').toLowerCase().includes(q);
    return srcOk && regOk2 && qOk;
  });
}
function merge(fresh, seed){
  var seen = new Set(), out = [];
  var all = fresh.concat(seed);
  for(var i=0;i<all.length;i++){
    var a = all[i];
    if(!seen.has(a.url)){
      seen.add(a.url);
      out.push(Object.assign({_ai:null,_aiLoading:false,_aiError:null}, a));
    }
  }
  out.sort(function(a,b){ return (b.published||'') > (a.published||'') ? 1 : -1; });
  return out;
}

// ── KEY MANAGEMENT ───────────────────────────────────────
function loadKey(){
  try{ apiKey = localStorage.getItem('li_key') || ''; }
  catch(e){ apiKey = ''; }
}
function saveKeyAction(){
  var v = document.getElementById('key-input').value.trim();
  if(!v){ alert('請輸入有效的 API Key'); return; }
  apiKey = v;
  try{ localStorage.setItem('li_key', v); } catch(e){}
  hideModal('key-modal');
  updateBanner();
  doRefresh();
}
function updateBanner(){
  var b = document.getElementById('no-key-banner');
  if(b) b.classList.toggle('hidden', !!apiKey);
}

// ── MODALS ───────────────────────────────────────────────
function showModal(id){
  var el = document.getElementById(id);
  if(el) el.classList.remove('hidden');
}
function hideModal(id){
  var el = document.getElementById(id);
  if(el) el.classList.add('hidden');
}
function openKeyModal(){
  var ki = document.getElementById('key-input');
  if(ki) ki.value = apiKey;
  showModal('key-modal');
}
function openSearchModal(){ showModal('search-modal'); }

// ── CLAUDE API ───────────────────────────────────────────
async function callClaude(messages, useSearch){
  if(!apiKey) throw new Error('NO_KEY');
  var body = { model:'claude-sonnet-4-6', max_tokens:1000, messages:messages };
  if(useSearch) body.tools = [{type:'web_search_20250305', name:'web_search'}];
  var resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify(body)
  });
  if(!resp.ok){
    var err = await resp.json().catch(function(){ return {error:{message:'HTTP '+resp.status}}; });
    throw new Error((err.error && err.error.message) || 'API '+resp.status);
  }
  return resp.json();
}
function extractText(data){
  if(!data || !data.content) return '';
  return data.content.filter(function(b){ return b.type==='text'; }).map(function(b){ return b.text; }).join('');
}
function parseJSON(txt){
  var m = txt.match(/\[[\s\S]*\]/);
  if(m){ try{ return JSON.parse(m[0]); } catch(e){} }
  m = txt.match(/\{[\s\S]*\}/);
  if(m){ try{ return JSON.parse(m[0]); } catch(e){} }
  return null;
}

// ── FETCH FRESH NEWS ─────────────────────────────────────
async function fetchFresh(){
  if(!apiKey) return [];
  try{
    var data = await callClaude([{role:'user',content:'Search for 8 most recent international labor rights news from 2026. Sources: ILO OECD Al Jazeera The Guardian HRW. Return ONLY a JSON array, no markdown. Each item: {"id":"f1","title":"繁體中文標題","url":"real url","published":"YYYY-MM-DD","source":"ILO or OECD or Al Jazeera or The Guardian or HRW","location":"Global or USA or UK or EU or Asia or India or ILO / UN"}'}], true);
    var txt = extractText(data);
    var arr = parseJSON(txt);
    if(!Array.isArray(arr)) return [];
    return arr.map(function(a,i){ return Object.assign({}, a, {id:'f'+Date.now()+i}); });
  } catch(e){ console.warn('fetchFresh failed:', e.message); return []; }
}

// ── LIVE SEARCH ──────────────────────────────────────────
async function doSearch(){
  var q = (document.getElementById('search-input').value||'').trim();
  if(!q) return;
  if(!apiKey){ hideModal('search-modal'); openKeyModal(); return; }
  hideModal('search-modal');
  var grid = document.getElementById('grid');
  grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--dim)">正在搜尋「'+esc(q)+'」相關新聞…</div>';
  try{
    var data = await callClaude([{role:'user',content:'Search for recent international news about this labor topic: "'+q+'". Find 8 relevant articles. Return ONLY a JSON array, no markdown. Each item: {"id":"q1","title":"繁體中文標題","url":"real url","published":"YYYY-MM-DD or null","source":"ILO or OECD or Al Jazeera or The Guardian or HRW","location":"Global or USA or UK or EU or Asia or India or ILO / UN"}'}], true);
    var txt = extractText(data);
    var arr = parseJSON(txt);
    var found = Array.isArray(arr) ? arr.map(function(a,i){ return Object.assign({},a,{id:'q'+Date.now()+i,_sq:q}); }) : [];
    arts = merge(found, arts);
    renderGrid();
  } catch(e){
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#e07070">搜尋失敗：'+esc(e.message)+'</div>';
  }
}

// ── AI ANALYSIS ──────────────────────────────────────────
async function loadAi(id){
  if(!apiKey){ openKeyModal(); return; }
  var idx = arts.findIndex(function(a){ return a.id===id; });
  if(idx<0) return;
  arts[idx]._aiLoading = true;
  arts[idx]._aiError = null;
  refreshAiZone(id);
  try{
    var a = arts[idx];
    var data = await callClaude([{role:'user',content:'你是勞動政策研究員。針對此新聞提供繁體中文分析。標題：'+a.title+' 來源：'+a.source+' 地區：'+a.location+' 回傳JSON（只JSON）：{"summary":"一句話摘要25字內","analysis":"深度分析80字含背景與影響","keywords":["詞1","詞2","詞3","詞4"]}'}], false);
    var txt = extractText(data);
    var obj = parseJSON(txt);
    if(!obj || !obj.summary) throw new Error('解析失敗');
    arts[idx]._ai = obj;
  } catch(e){
    arts[idx]._aiError = e.message==='NO_KEY' ? '請設定 API Key' : e.message;
  }
  arts[idx]._aiLoading = false;
  refreshAiZone(id);
  // auto open
  var body = document.getElementById('ai-body-'+id);
  var tog  = document.getElementById('ai-tog-'+id);
  if(body && arts[idx]._ai){ body.classList.add('vis'); if(tog) tog.classList.add('open'); }
}
function toggleAiBody(id){
  var body = document.getElementById('ai-body-'+id);
  var tog  = document.getElementById('ai-tog-'+id);
  if(!body) return;
  var v = body.classList.toggle('vis');
  if(tog) tog.classList.toggle('open', v);
}
function buildAiZone(a){
  if(a._aiLoading){
    return '<button class="aitog open"><span class="ai-spin"></span>&nbsp;AI 分析中…</button>'
         + '<div class="aibody vis"><div class="ait" style="color:var(--dim)">請稍候…</div></div>';
  }
  if(a._ai){
    var kw = (a._ai.keywords||[]).map(function(k){ return '<span class="aitag">'+esc(k)+'</span>'; }).join('');
    return '<button class="aitog" id="ai-tog-'+a.id+'" onclick="toggleAiBody(\''+a.id+'\')">'
         + '✦ AI 摘要與分析 <span class="chev">▾</span></button>'
         + '<div class="aibody" id="ai-body-'+a.id+'">'
         + '<div><div class="ail">一句話摘要</div><div class="ait">'+esc(a._ai.summary)+'</div></div>'
         + '<div><div class="ail">深度分析</div><div class="ait">'+esc(a._ai.analysis)+'</div></div>'
         + '<div><div class="ail">關鍵詞</div><div class="aitags">'+kw+'</div></div>'
         + '</div>';
  }
  if(a._aiError){
    return '<button class="aitog" onclick="loadAi(\''+a.id+'\')">✦ AI 分析失敗，點擊重試 <span class="chev">▾</span></button>';
  }
  return '<button class="aitog" id="ai-tog-'+a.id+'" onclick="loadAi(\''+a.id+'\')">'
       + '✦ AI 摘要與分析 <span class="chev">▾</span></button>';
}
function refreshAiZone(id){
  var zone = document.getElementById('ai-zone-'+id);
  if(!zone) return;
  var a = arts.find(function(x){ return x.id===id; });
  if(!a) return;
  zone.innerHTML = buildAiZone(a);
}

// ── RENDER ───────────────────────────────────────────────
function buildCard(a){
  var sc = srcClass(a.source);
  var sq = a._sq ? '<span class="rpill" style="border-color:var(--accent);color:var(--accent)">搜：'+esc(a._sq)+'</span>' : '';
  return '<article class="card">'
    + '<div class="ctop">'
    + '<div class="cmeta"><span class="spill s-'+sc+'">'+esc(a.source)+'</span>'
    + '<span class="rpill">'+esc(a.location||'Global')+'</span>'+sq
    + '<span class="cdate">'+fmtD(a.published)+'</span></div>'
    + '<h2 class="ctitle"><a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.title)+'</a></h2>'
    + '</div>'
    + '<div class="aizone" id="ai-zone-'+a.id+'">'+buildAiZone(a)+'</div>'
    + '<div class="cfoot"><span class="csc">擷取 '+fmtD(TODAY)+'</span>'
    + '<a class="clink" href="'+esc(a.url)+'" target="_blank" rel="noopener">原文 ↗</a></div>'
    + '</article>';
}
function renderGrid(){
  var filtered = getFiltered();
  var grid = document.getElementById('grid');
  if(!grid) return;

  // update counts
  var cnt = {};
  arts.forEach(function(a){ cnt[a.source] = (cnt[a.source]||0)+1; });
  var el;
  el=document.getElementById('cnt-all');  if(el) el.textContent=arts.length;
  el=document.getElementById('cnt-ILO');  if(el) el.textContent=cnt['ILO']||0;
  el=document.getElementById('cnt-OECD'); if(el) el.textContent=cnt['OECD']||0;
  el=document.getElementById('cnt-AJ');   if(el) el.textContent=cnt['Al Jazeera']||0;
  el=document.getElementById('cnt-TG');   if(el) el.textContent=cnt['The Guardian']||0;
  el=document.getElementById('cnt-HRW');  if(el) el.textContent=cnt['HRW']||0;

  el=document.getElementById('s-total'); if(el) el.textContent=arts.length;
  el=document.getElementById('s-shown'); if(el) el.textContent=filtered.length;
  el=document.getElementById('s-ai');    if(el) el.textContent=arts.filter(function(a){return a._ai;}).length;

  if(!filtered.length){
    grid.innerHTML='<div class="empty">找不到符合條件的新聞。</div>';
    return;
  }
  grid.innerHTML = filtered.map(buildCard).join('');
}

// ── REFRESH ──────────────────────────────────────────────
function setTime(){
  var el = document.getElementById('t-time');
  if(el) el.textContent = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function startCd(){
  clearInterval(cdTimer);
  nextAt = Date.now() + 20*60*1000;
  cdTimer = setInterval(function(){
    var s = Math.max(0, Math.round((nextAt - Date.now())/1000));
    var el = document.getElementById('t-cd');
    if(el) el.textContent = s>60 ? Math.floor(s/60)+'分'+s%60+'秒' : s+'秒';
  }, 1000);
}
async function doRefresh(){
  var icon = document.getElementById('refresh-icon');
  var btn  = document.getElementById('btn-refresh');
  if(icon) icon.className='rbtn-spin';
  if(btn)  btn.disabled=true;
  try{
    var fresh = await fetchFresh();
    arts = merge(fresh, arts);
    setTime();
    renderGrid();
  } catch(e){ console.error('refresh error:', e); }
  if(icon) icon.className='';
  if(btn)  btn.disabled=false;
  startCd();
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(doRefresh, 20*60*1000);
}

// ── EVENT WIRING ─────────────────────────────────────────
function wireEvents(){
  // Sidebar filter buttons
  document.querySelectorAll('.sb-btn[data-g]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var g = btn.getAttribute('data-g');
      document.querySelectorAll('.sb-btn[data-g="'+g+'"]').forEach(function(b){ b.classList.remove('on'); });
      btn.classList.add('on');
      if(g==='src') fSrc = btn.getAttribute('data-v');
      if(g==='reg') fReg = btn.getAttribute('data-v');
      renderGrid();
    });
  });

  // Filter input
  var fi = document.getElementById('filter-input');
  if(fi) fi.addEventListener('input', function(){ fQ=fi.value; renderGrid(); });

  // Topbar buttons
  var bk=document.getElementById('btn-key'); if(bk) bk.addEventListener('click', openKeyModal);
  var bs=document.getElementById('btn-search'); if(bs) bs.addEventListener('click', openSearchModal);
  var br=document.getElementById('btn-refresh'); if(br) br.addEventListener('click', doRefresh);

  // Sidebar shortcuts
  var sbS=document.getElementById('sb-search'); if(sbS) sbS.addEventListener('click', openSearchModal);
  var sbK=document.getElementById('sb-key');    if(sbK) sbK.addEventListener('click', openKeyModal);

  // Banner
  var bb=document.getElementById('banner-btn'); if(bb) bb.addEventListener('click', openKeyModal);

  // Key modal buttons
  var ksk=document.getElementById('key-skip'); if(ksk) ksk.addEventListener('click', function(){ hideModal('key-modal'); });
  var ksv=document.getElementById('key-save'); if(ksv) ksv.addEventListener('click', saveKeyAction);
  var ki=document.getElementById('key-input');
  if(ki) ki.addEventListener('keydown', function(e){ if(e.key==='Enter') saveKeyAction(); });

  // Search modal buttons
  var sc=document.getElementById('search-cancel'); if(sc) sc.addEventListener('click', function(){ hideModal('search-modal'); });
  var sg=document.getElementById('search-go');     if(sg) sg.addEventListener('click', doSearch);
  var si=document.getElementById('search-input');
  if(si) si.addEventListener('keydown', function(e){ if(e.key==='Enter') doSearch(); });

  // Click outside modal to close
  document.getElementById('key-modal').addEventListener('click', function(e){ if(e.target===this) hideModal('key-modal'); });
  document.getElementById('search-modal').addEventListener('click', function(e){ if(e.target===this) hideModal('search-modal'); });
}

// ── BOOT ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function(){
  // 1. Wire all events
  wireEvents();

  // 2. Load key from storage
  loadKey();
  updateBanner();

  // 3. Render seed data IMMEDIATELY — no async, no waiting
  arts = merge([], SEED);
  setTime();
  renderGrid();

  // 4. Start countdown
  startCd();

  // 5. If key exists, fetch fresh news in background
  if(apiKey){
    fetchFresh().then(function(fresh){
      if(fresh.length){ arts = merge(fresh, arts); renderGrid(); setTime(); }
    }).catch(function(e){ console.warn('background fetch:', e); });
  } else {
    // Show key modal after a brief delay (non-blocking)
    setTimeout(function(){ openKeyModal(); }, 800);
  }

  // 6. Schedule auto-refresh
  refreshTimer = setTimeout(doRefresh, 20*60*1000);
});
</script>
</body>
</html>
